name = "deskline"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

# Secrets (never committed): set with `wrangler secret put DATABASE_URL`

# Public demo: reset the fictional data every day at 08:00 UTC.
[triggers]
crons = ["0 8 * * *"]
